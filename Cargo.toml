[package]
name = "discord_social_rpc"
version = "0.1.0"
edition = "2021"
description = "A Rust library for Discord Rich Presence using the sdk.social_layer_presence OAuth2 scope"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2"
thiserror = "2"
log = "0.4"